<title>Rackgram</title>
<style>
:root{--bg:#fff;--fg:#18181b;--mut:#71717a;--line:#e4e4e7;--pri:#52525B;--on:#fff;--card:#f4f4f5;--err:#dc2626;--ok:#16a34a;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}button,a,svg,[onclick],.it,.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
body{background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:420px;padding:28px 22px;display:flex;flex-direction:column;overflow-y:auto}
.logo{width:96px;height:96px;margin:24px auto 18px;display:block}
h1{font-size:22px;margin:0 0 6px;text-align:center}
p.sub{color:var(--mut);margin:0 0 24px;text-align:center;font-size:14px}
label{font-size:12px;color:var(--mut);display:block;margin:0 0 6px}
.row{display:flex;gap:10px;margin-bottom:14px}
select,input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;padding:0 14px;outline:none}
select{width:42%;flex:none}
select:focus,input:focus{border-color:var(--pri)}
button{height:50px;border:0;border-radius:12px;background:var(--pri);color:var(--on);font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;width:100%;margin-top:6px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.link{background:none;color:var(--mut);font-weight:500;font-size:14px;height:40px}
.hint{font-size:12px;margin:-8px 0 12px;min-height:16px;color:var(--mut)}.hint.bad{color:var(--err)}.hint.good{color:var(--ok)}
.otp{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.otp input{flex:1 1 0;min-width:0;max-width:46px;width:auto;height:54px;padding:0;text-align:center;font-size:20px;font-weight:600}
.demo{background:var(--card);border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--mut);margin-bottom:18px}
.demo b{color:var(--fg);letter-spacing:3px;font-size:17px}
.hide{display:none!important}

/* ---------- Main (Telegram-style) ---------- */
.app.full{padding:0;overflow:hidden}
#s4,#s5{height:100%;flex-direction:column}
#s4:not(.hide),#s5:not(.hide){display:flex}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex:none;min-height:68px}
.top h2{flex:1;margin:0;font-size:20px;font-weight:700;text-align:center}
.top .side{width:64px;flex:none;display:flex}
.top .side.r{justify-content:flex-end}
.tx{width:auto;height:40px;margin:0;padding:0 8px;background:none;color:var(--fg);font-size:16px;font-weight:600;border-radius:10px}
.tx:disabled{opacity:.35}
.sb{position:relative;flex:1}
.sb svg{position:absolute;left:14px;top:50%;margin-top:-9px;width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.sb input{height:42px;border-radius:21px;background:var(--card);border-color:transparent;padding:0 38px 0 40px;font-size:15px}
.sb input:focus{border-color:var(--pri);background:var(--bg)}
.sb .x{position:absolute;right:3px;top:3px;width:36px;height:36px;margin:0;padding:0;background:none;color:var(--mut);font-size:20px;font-weight:400;border-radius:50%}
.tabs{display:flex;gap:8px;padding:2px 16px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{width:auto;height:34px;margin:0;padding:0 14px;border-radius:17px;background:var(--card);color:var(--mut);font-size:13px;font-weight:600;flex:none}
.tab.on{background:var(--pri);color:var(--on)}
.pane{flex:1;overflow-y:auto;min-height:0}
.list{padding:0 8px 16px}
.it{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:12px}
.it:active{background:var(--card)}
.ava{width:52px;height:52px;border-radius:50%;background:var(--pri);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:19px;flex:none}
.ava.a2{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.ava.ch{border-radius:16px}
.ava svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.it .t{flex:1;min-width:0}
.it .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s.miss{color:var(--err)}
.it .m{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.it .tm{font-size:12px;color:var(--mut)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--pri);color:var(--on);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}
.it mark{background:none;color:var(--fg);font-weight:800;text-decoration:underline;text-decoration-color:var(--mut);text-underline-offset:2px}
.kind{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:2px 8px;flex:none}
.empty{text-align:center;color:var(--mut);padding:56px 24px;font-size:14px}

/* bottom bar */
.nav{display:flex;flex:none;border-top:1px solid var(--line);background:var(--bg);padding:6px 4px}
.nb{flex:1;margin:0;height:54px;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;border-radius:12px;position:relative}
.nb svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--fg)}
.nb.on svg{fill:var(--card)}
.nb .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--pri);color:var(--on);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* settings tab */
.me{text-align:center;padding:10px 16px 20px}
.av{width:92px;height:92px;border-radius:50%;background:var(--pri);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600;margin:0 auto 12px}
.name{font-size:22px;font-weight:600}.user{color:var(--mut);margin-top:2px;min-height:20px}
.ph{color:var(--mut);font-size:14px;margin-top:2px}
.grp{margin:0 16px 16px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row2{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.row2:first-child{border-top:0}
.row2 .l{flex:1;min-width:0}
.row2 .k{font-size:12px;color:var(--mut)}
.row2 .v{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.rowb{width:100%;margin:0;height:auto;background:none;color:var(--fg);font-weight:500;font-size:16px;text-align:left;border-radius:0}
button.rowb.out{color:var(--err)}
.set{padding:8px 22px 28px;overflow-y:auto}
.set .av{margin:10px auto 22px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
#s6,#s7{height:100%;flex-direction:column}#s6:not(.hide),#s7:not(.hide){display:flex}
.dpb{display:flex;justify-content:center;gap:8px;margin:-10px 0 18px}.dpb .tx{font-size:14px;color:var(--pri)}
.chh{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}.chh .ava{width:38px;height:38px;font-size:15px}.chh .ava svg{width:20px;height:20px}
.chh .n{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chh .s{font-size:12px;color:var(--mut)}
.msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.b{max-width:78%;padding:8px 12px;border-radius:16px;font-size:15px;word-wrap:break-word}.b.in{align-self:flex-start;background:var(--bg)}.b.in.hasav{margin-left:40px;position:relative;max-width:calc(78% - 12px)}.mav{position:absolute;left:-40px;bottom:0;width:32px;height:32px;cursor:pointer}.mav .ava{width:32px;height:32px;font-size:13px;margin:0}.gsn{cursor:pointer}.b.out{align-self:flex-end;background:var(--pri);color:var(--on)}
.cin{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.cin input{height:44px;border-radius:22px}.cin button{width:auto;height:44px;margin:0;padding:0 18px;border-radius:22px}.cin .blk{flex:1;text-align:center;color:var(--mut);font-size:14px}.cin .blk button{background:none;color:var(--pri);height:auto;padding:0 6px}
.dots{font-size:24px;line-height:1}.pf{text-align:center;padding:16px}.pf .av{margin-bottom:10px}.pf .ava{margin:0 auto 10px;width:92px;height:92px}.pf .ava svg{width:40px;height:40px}.pf .pb2{width:auto;padding:0 24px;margin:12px 4px 0;display:inline-block}
.st{display:inline-block;font-size:12px;color:var(--err);border:1px solid var(--err);border-radius:8px;padding:2px 8px;margin-top:6px}.sec{padding:8px 16px;font-size:13px;color:var(--mut);font-weight:600}
.menu{position:fixed;top:60px;right:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:30;overflow:hidden;min-width:180px}
.menu button{height:46px;margin:0;border-radius:0;background:none;color:var(--fg);text-align:left;padding:0 16px;font-weight:500;font-size:15px}.menu button.d{color:var(--err)}
#sty{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center}#sty img{max-width:100%;max-height:100%}
.sbar{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:12px}.sbar button{width:auto;height:40px;padding:0 16px;margin:0;background:rgba(255,255,255,.2);color:#fff}
.tx svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#s8{height:100%;flex-direction:column}#s8:not(.hide){display:flex}
/* New group / channel sizes (tuned by user) */
#s8 .top h2{font-size:18px}
#s8 .set{padding:8px 17px 28px}
#s8 label{font-size:16px}
#s8 input{height:47px;font-size:16px;border-radius:11px}

#s8 .hint{margin:0 0 12px}
#csbk{white-space:nowrap;width:auto}
#s9{height:100%;flex-direction:column}#s9:not(.hide){display:flex}
.csb{flex:1;overflow-y:auto;padding:0 16px 28px}
.cs-h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:14px 4px 8px}
.cs-c{background:var(--card);border-radius:18px;padding:14px}
.cs-prev{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;background:var(--card)}
.cs-sl{display:flex;align-items:center;gap:10px;font-size:19px}.cs-sl b{min-width:30px;text-align:right}
.cs-sl input{flex:1;width:auto;height:30px;padding:0;border:0;background:transparent;border-radius:0}
.cs-tl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cs-t{height:64px;border-radius:12px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-align:center;background-size:cover}
.cs-t.on{border-color:#fff;outline:2px solid var(--pri)}
.cs-ds{display:flex;gap:10px;flex-wrap:wrap}.cs-d{width:44px;height:44px;border-radius:50%;border:2px solid transparent}.cs-d.on{border-color:#fff;outline:2px solid #888}
.cs-seg{display:flex;background:rgba(127,127,127,.18);border-radius:12px;padding:3px;gap:3px}
.cs-seg button{flex:1;margin:0;height:34px;border-radius:9px;background:transparent;color:var(--fg);font-size:16px;font-weight:600}.cs-seg button.on{background:var(--pri);color:var(--on)}
.cs-r{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:19px;border-top:1px solid var(--line)}.cs-r:first-child{border-top:0}
.cs-sw{width:44px;height:26px;border-radius:13px;background:#52525b;position:relative;flex:none}.cs-sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.cs-sw.on{background:#16a34a}.cs-sw.on::after{left:21px}
/* smooth open animations */
@keyframes csIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes csUp{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
@keyframes csFade{from{opacity:0}to{opacity:1}}
@keyframes csPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.app>section:not(.hide){animation:csIn .22s cubic-bezier(.2,.8,.2,1)}
#sheet:not(.hide) .pn{animation:csUp .26s cubic-bezier(.2,.8,.2,1)}
#sheet:not(.hide) .bk{animation:csFade .2s ease-out}
.menu:not(.hide){animation:csPop .14s ease-out;transform-origin:top right}
#k_call:not(.hide),#k_ring:not(.hide){animation:csFade .22s ease-out}
button{transition:transform .1s,background-color .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.96)}
*{-webkit-tap-highlight-color:transparent}
button,a,.it,.nb,.tab{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){.app>section,#sheet .pn,#sheet .bk,.menu,#k_call,#k_ring{animation:none!important}}

 L.push({id:0,i:0,t:e.t,fw:false,h:hmOf(new Date(e.ts).toISOString()),ts:e.ts,r:1,d:0,rd:0,img:"",vd:"",au:"",asec:0,rt:e.rt||0,ed:"",ex:0,cid:e.cid,s:me.id,p:e.f?2:1,g:isGrp(e.n)?1:0});pendRedraw(e.n)}

async function flushOB(){
 if(X.flushing||!me)return;X.flushing=true;
 try{for(const e of OB.slice()){
  if(e.u!==me.id||e.f)continue;
  if(!navigator.onLine)break;
  const row={body:e.t,client_id:e.cid};if(e.rt)row.reply_to=e.rt;
  let r;try{r=await insertRow(e.n,{...row})}catch(x){break}
  if(r.error){
   if(r.error.code==="23505"){
    const q=await sb.from(isGrp(e.n)?"group_messages":"messages").select("*").eq("sender_id",me.id).eq("client_id",e.cid).maybeSingle();
    if(q.data)r={data:q.data};else{OB=OB.filter(y=>y!==e);saveOB();continue}
   }else if(netErr(r.error))break;
   else{e.f=1;saveOB();const L=Lr(e.n).find(x=>x.cid===e.cid);if(L)L.p=2;pendRedraw(e.n);toast("Message not sent");continue}
  }
  OB=OB.filter(y=>y!==e);saveOB();
  const L=L_(e.n),i=L.findIndex(x=>x.cid===e.cid&&x.p);if(i>=0)L.splice(i,1);
  addAny(e.n,r.data)}}
 finally{X.flushing=false}}
function pendSheet(cid){const e=OB.find(y=>y.cid===cid);if(!e)return;
 sheet(`<h3>${e.f?"Message not sent":"Waiting to send"}</h3><div class="sec" style="padding:0 0 8px">${e.f?"This message couldn't be delivered.":"It will be sent automatically when you're back online."}</div><button class="rowb" id="pr">Try again</button><button class="rowb out" id="pdl">Delete</button><button class="rowb" data-x="1">Close</button>`);
 $("pr").onclick=()=>{unsheet();e.f=0;saveOB();const x=Lr(e.n).find(y=>y.cid===cid);if(x)x.p=1;pendRedraw(e.n);flushOB()};
 $("pdl").onclick=()=>{unsheet();OB=OB.filter(y=>y!==e);saveOB();const L=Lr(e.n),i=L.findIndex(y=>y.cid===cid);if(i>=0)L.splice(i,1);pendRedraw(e.n)}}

async function sendMedia(n,k,blob,ext,ctype,extra){
 const rp=X.reply&&X.reply.id||0;X.reply=null;paintBar();
 try{
  toast(k==="au"?"Sending voice message...":k==="vd"?"Sending video...":"Sending photo...");
  const path=me.id+"/"+uid4()+"."+ext;
  const up=await sb.storage.from("chat-media").upload(path,blob,{contentType:ctype});if(up.error)throw up.error;
  const url=sb.storage.from("chat-media").getPublicUrl(path).data.publicUrl;
  const row={client_id:uid4()};
  if(k==="au"){row.body="🎤 Voice message";row.audio_url=url;row.audio_secs=Math.min(900,Math.max(0,Math.round(extra.secs)))}
  else if(k==="vd"){row.body="🎬 Video";row.video_url=url}
  else{row.body="📷 Photo";row.image_url=url}
  if(rp)row.reply_to=rp;
  const r=await insertRow(n,row);if(r.error)throw r.error;addAny(n,r.data)
 }catch(e){toast(k==="au"?"Voice message not sent":k==="vd"?"Video not sent (too big?)":"Photo not sent")}}

const ICO_TRASH='<svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
async function recStart(n){

 if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Voice messages aren't supported on this device");

 const R={rec,st,ch:[],t0:Date.now(),n,send:false,tick:0};X.rec=R;

  if(openChatId()===R.n)composer(R.n);

 $("rcx").onclick=()=>{R.send=false;rec.stop()};$("rcs").onclick=()=>{R.send=true;rec.stop()};
 R.tick=setInterval(()=>{const s=(Date.now()-R.t0)/1000,e=$("rct");if(e)e.textContent=fmtDur(s);
  if(openChatId()!==R.n){R.send=false;try{rec.stop()}catch(x){}return}

/* video: max 3 minutes. In-app recorder uses a low bitrate so 3 min always fits the upload limit */
const VMAX=180,VBYTES=50*1024*1024,OKV=["video/mp4","video/webm","video/quicktime","video/3gpp"];
const extOf=t=>t.includes("webm")?"webm":t.includes("quicktime")?"mov":t.includes("3gpp")?"3gp":"mp4";

function onVidPick(e){
 const f=e.target.files[0];e.target.value="";if(!f||!attTo)return;const n=attTo;
 const type=(f.type||"").split(";")[0]||"video/mp4";
 if(!OKV.includes(type))return toast("This video format isn't supported");
 if(f.size>VBYTES)return toast("Video is too big (max 50 MB). Try recording it in the app.");
 const url=URL.createObjectURL(f),v=document.createElement("video");v.preload="metadata";
 v.onloadedmetadata=()=>{const dur=v.duration;URL.revokeObjectURL(url);if(isFinite(dur)&&dur>VMAX+1)return toast("Video can be at most 3 minutes");confirmVideo(n,f,extOf(type),type)};
 v.onerror=()=>{URL.revokeObjectURL(url);confirmVideo(n,f,extOf(type),type)};
 v.src=url}

  let gq={data:[]};try{gq=await sb.from("groups").select(GCOLS).eq("is_public",true).or(`name.ilike.%${s}%,username.ilike.%${s}%`).limit(10)}catch(e){}

/* group info page */
const _sp=showProf;
showProf=function(n){const d=find(n);if(d&&d.k!=="acc")return showGroupProf(n);return _sp(n)};
function showGroupProf(n){
 const d=GRP[n];if(!d)return;show(7);$("pdw").innerHTML="";
 const mem=GMEM[n]||[],adm=isAdm(d),own=d.role==="owner",W=d.k==="cha"?"channel":"group";
 let h=`<div class="pf">${avatar(d.k,d.n,n)}<div class="name">${esc(d.n)}</div><div class="user">${d.u?"@"+esc(d.u)+" · ":""}${esc(d.m)}</div><div>`
  +(d.member?`<button class="pb2" id="gpm">Open chat</button><button class="pb2" id="gpmu">${MUTED.includes(n)?"Unmute":"Mute"}</button>`:`<button class="pb2" id="gpj">Join</button>`)+`</div></div>`;
 if(d.member){
  if(d.desc)h+=`<div class="grp"><div class="row2"><div class="l"><div class="k">About</div><div class="v" style="white-space:pre-wrap">${esc(d.desc)}</div></div></div></div>`;
  h+=`<div class="grp"><div class="row2"><div class="l"><div class="k">${d.pub?"Public link":"Invite link"}</div><div class="v" id="glk">${d.pub?linkTxt(esc(d.u)):"Tap Copy to get the link"}</div></div><button class="tx" id="gcp">Copy</button></div></div>`;
  h+=`<div class="sec">${esc(d.m)}</div><div class="list gmem">`;
  h+=`<button class="rowb" data-g="add" style="padding:10px 14px">+ Add member</button>`;
  const rk={owner:0,admin:1,member:2};
  mem.slice().sort((a,b)=>rk[a.r]-rk[b.r]).forEach(m=>{const p=PEOPLE[m.u],nm=m.u===me.id?"You":(p?p.n:"Someone");
   h+=`<div class="it" data-mu="${esc(m.u)}">${m.u===me.id?`<div class="ava">${esc(me.name.trim()[0].toUpperCase())}</div>`:avatar("acc",nm,m.u)}<div class="t"><div class="n">${esc(nm)}</div><div class="s">${m.r==="owner"?"Owner":m.r==="admin"?esc(m.t||"Admin"):"Member"}</div></div></div>`});
  h+=`</div><div class="grp">`;
  if(can(d,"info"))h+=`<div class="row2"><button class="rowb" data-g="ren">Edit name, photo &amp; description</button></div>`;
  if(can(d,"perm")||(!d.pub&&can(d,"link")))h+=`<div class="row2"><button class="rowb" data-g="perm">Permissions</button></div>`;
  if(!d.pub&&(can(d,"add")||can(d,"link")))h+=`<div class="row2"><button class="rowb" data-g="req">Join requests<span id="grq"></span></button></div>`;
  h+=own?`<div class="row2"><button class="rowb out" data-g="del">Delete ${W}</button></div>`:`<div class="row2"><button class="rowb out" data-g="leave">Leave ${W}</button></div>`;
  h+="</div>"}
 const b=$("pbody");b.innerHTML=h;if(d.member&&!d.pub&&(can(d,"add")||can(d,"link")))reqCount(n);
 if($("gpm"))$("gpm").onclick=()=>go({t:"c",n});
 if($("gpmu"))$("gpmu").onclick=async()=>{await toggleMute(n);$("gpmu").textContent=MUTED.includes(n)?"Unmute":"Mute"};
 if($("gpj"))$("gpj").onclick=()=>joinPublic(n);
 if($("gcp"))$("gcp").onclick=async()=>{let t=d.pub?linkFull(d.u):null;
  if(!t){const r=await sb.rpc("group_invite_code",{p_gid:n});if(r.error||!r.data){toast("Couldn't get the link");return}t=linkFull("+"+r.data);$("glk").textContent=linkTxt("+"+r.data)}
  copyTxt(t,"Link copied")};
 b.onclick=e=>{const g=e.target.closest("[data-g]");if(g)return grpAct(g.dataset.g,n);const it=e.target.closest(".it[data-mu]");if(it)memberSheet(n,it.dataset.mu)}}
async function grpGone(n){delete GRP[n];delete GM[n];if(X.gl)X.gl.delete(n);await loadGroups();hist=[];cv=null;cur2="cht";render();show(4)}
function grpAct(a,n){const d=GRP[n],W=d.k==="cha"?"channel":"group";
 if(a==="add")return addMemberSheet(n);
 if(a==="perm")return permSheet(n);
 if(a==="req")return joinReqs(n);
 if(a==="ren")return editInfoSheet(n);
 if(a==="leave"){sheet(`<h3>Leave ${W}?</h3><div class="sec" style="padding:0 0 10px">You won't get new messages from "${esc(d.n)}".</div><button class="rowb out" id="gy">Leave</button><button class="rowb" data-x="1">Cancel</button>`);
  $("gy").onclick=async()=>{const r=await sb.from("group_members").delete().eq("group_id",n).eq("user_id",me.id);if(r.error){toast("Couldn't leave");return}unsheet();await grpGone(n);toast("You left")};return}
 if(a==="del"){sheet(`<h3>Delete ${W}?</h3><div class="sec" style="padding:0 0 10px">"${esc(d.n)}" and all its messages will be deleted for everyone. This can't be undone.</div><button class="rowb out" id="gy">Delete</button><button class="rowb" data-x="1">Cancel</button>`);
  $("gy").onclick=async()=>{const r=await sb.from("groups").delete().eq("id",n);if(r.error){toast("Couldn't delete");return}unsheet();await grpGone(n);toast("Deleted")}}}
function memberSheet(n,u){const d=GRP[n];if(u===me.id)return;const m=(GMEM[n]||[]).find(x=>x.u===u);if(!m)return;
 const p=PEOPLE[u],nm=p?p.n:"Member",own=d.role==="owner",W=d.k==="cha"?"channel":"group";
 const mkA=m.r==="member"&&(own||can(d,"adm")),edA=m.r==="admin"&&(own||(can(d,"adm")&&m.pb===me.id)),rmv=m.r!=="owner"&&can(d,"ban")&&(m.r==="member"||own);
 sheet(`<h3>${esc(nm)}</h3><button class="rowb" data-o="msg">Message</button>${mkA?'<button class="rowb" data-o="mk">Make admin</button>':""}${edA?'<button class="rowb" data-o="ed">Admin rights</button>':""}${rmv?'<button class="rowb out" data-o="rm">Remove from '+W+"</button>":""}<button class="rowb" data-x="1">Close</button>`);
 $("sheet").querySelectorAll("[data-o]").forEach(b=>b.onclick=async()=>{const o=b.dataset.o;unsheet();
  if(o==="msg"){if(PEOPLE[u]){hist=[];cv=null;cur2="cht";render();show(4);go({t:"c",n:u})}return}
  if(o==="mk"||o==="ed")return adminRights(n,u);
  const r=await sb.from("group_members").delete().eq("group_id",n).eq("user_id",u);
  if(r.error){toast(r.error.code==="42501"?"You can't do that":"Couldn't update");return}await loadGroups();if(cv&&cv.t==="p"&&cv.n===n)showGroupProf(n);toast("Done")})}
async function addMemberSheet(n){const have=new Set((GMEM[n]||[]).map(x=>x.u)),dis=new Set(),LIM=10,sv=ST.saved||[];
 const okb=x=>x&&x!==me.id&&!have.has(x)&&!(ST.blk||[]).includes(x);
 const known=Object.values(PEOPLE).filter(x=>x.k==="acc"&&okb(x.id)&&((MSG[x.id]||[]).length||sv.includes(x.id))).map(x=>({p:x,t:sv.includes(x.id)?"Saved":isRq(x.id)?"Request":"Chat"})).sort((a,b)=>String(a.p.n).localeCompare(String(b.p.n)));
 let left=LIM,found=[],qv="",tm=0,searching=false;
 sheet('<h3>Add member</h3><input id="amq" placeholder="Search name or @username" autocapitalize="none" autocomplete="off" style="margin-bottom:6px"><div class="sec" id="aml" style="padding:0 0 6px"></div><div id="amr" style="max-height:44vh;overflow:auto"></div><button class="rowb" data-x="1">Cancel</button>');
 const row=(p,t)=>`<button class="rowb sp" data-p="${esc(String(p.id))}"><span>${esc(p.n)}</span><span class="s">${p.u?"@"+esc(p.u):""}${t?(p.u?" \u00B7 ":"")+t:""}</span></button>`;
 const clean=()=>qv.replace(/^@/,"").replace(/[%,()*\\]/g,"");
 const draw=()=>{if(!$("aml"))return;const q=clean().toLowerCase();
  $("aml").textContent=left+" of "+LIM+" direct adds left. Others can join with the link.";
  const kn=known.filter(k=>!q||String(k.p.n).toLowerCase().includes(q)||(k.p.u||"").toLowerCase().includes(q)),fr=found.filter(p=>!kn.some(k=>k.p.id===p.id));
  let h="";
  if(kn.length)h+=`<div class="s3" style="margin:6px 4px">${q?"From your chats":"People you know"}</div>`+kn.map(k=>row(k.p,dis.has(k.p.id)?"Added":k.t)).join("");
  if(q)h+=`<div class="s3" style="margin:10px 4px 6px">Everyone on Rackgram</div>`+(fr.length?fr.map(p=>row(p,dis.has(p.id)?"Added":"")).join(""):'<div class="n3">'+(searching?"Searching\u2026":"No one found")+"</div>");
  else if(!kn.length)h='<div class="n3">Search by name or @username to add someone.</div>';
  $("amr").innerHTML=h};
 $("amq").oninput=()=>{qv=$("amq").value.trim();clearTimeout(tm);const s=clean();if(s.length<2){found=[];searching=false;draw();return}
  searching=true;draw();
  tm=setTimeout(async()=>{const r=await sb.from("profiles").select("id,name,username,avatar_url").or(`name.ilike.%${s}%,username.ilike.%${s}%`).limit(15);
   if(clean()!==s||!$("aml"))return;searching=false;
   found=(r.data||[]).filter(x=>okb(x.id)).map(x=>PEOPLE[x.id]||{k:"acc",id:x.id,n:x.name,rn:x.name,av:x.avatar_url||"",u:x.username||""});draw()},250)};
 $("amr").onclick=async e=>{const b=e.target.closest("[data-p]");if(!b)return;const id=b.dataset.p;if(dis.has(id))return;
  if(left<1){toast("You've used all 10 direct adds. Share the invite link instead.");return}
  const r=await sb.from("group_members").insert({group_id:n,user_id:id,role:"member"});
  if(r.error){toast(r.error.code==="23505"?"Already a member":r.error.code==="P0001"&&r.error.message?r.error.message:r.error.code==="42501"?"You can't add this person":"Couldn't add");return}
  dis.add(id);have.add(id);left--;draw();loadGroups().then(()=>{if(cv&&cv.t==="p"&&cv.n===n)showGroupProf(n)});toast("Member added")};
 draw();
 sb.from("group_members").select("user_id",{count:"exact",head:true}).eq("group_id",n).eq("added_by",me.id).then(r=>{if(!r.error&&typeof r.count==="number"){left=Math.max(0,LIM-r.count);draw()}})}

/* admin rights screen (Telegram style) + join requests */
let S12N=null;
const AR=[["info","\u270F\uFE0F","Change group info","Name, photo, description"],["del","\uD83D\uDDD1\uFE0F","Delete messages","Remove anyone's messages"],["perm","\uD83D\uDD12","Edit group permissions","Who can send, share media, react"],["mute","\uD83D\uDD07","Mute members","Restrict someone for a while"],["ban","\uD83D\uDEAB","Remove members","Ban from the group"],["add","\u2795","Add members","Approve join requests"],["link","\uD83D\uDD17","Manage invite link","See, copy, reset the link"],["pin","\uD83D\uDCCC","Pin messages","Pin and unpin"],["call","\uD83D\uDCDE","Manage calls","Start and end group calls"],["adm","\uD83D\uDEE1\uFE0F","Add new admins","Can promote others"]];
$("s12bk").onclick=()=>{if(S12N&&GRP[S12N])showGroupProf(S12N);else{show(4)}};
function adminRights(n,u){const d=GRP[n],m=(GMEM[n]||[]).find(x=>x.u===u);if(!m)return;
 S12N=n;const own=d.role==="owner",isA=m.r==="admin",nm=(PEOPLE[u]||{}).n||"Member";
 const st={};AR.forEach(a=>{st[a[0]]=isA?!!(m.p&&m.p[a[0]]):["info","del","mute","add","pin"].includes(a[0])});
 let an=!!m.an,ti=m.t||"";const cn=k=>own||!!(d.pm&&d.pm[k]);
 const allOn=()=>AR.every(a=>st[a[0]]||!cn(a[0]));
 const draw=()=>{$("s12b").innerHTML=`<div class="ar-u">${avatar("acc",nm,u)}<div><div class="n">${esc(nm)}</div><div class="s">${isA?"Admin":"Will become admin"}</div></div></div>`
  +`<div class="s3 ar-h"><span>What can this admin do?</span><button class="tx" data-ar="all">${allOn()?"Turn all off":"Turn all on"}</button></div>`
  +AR.map(a=>`<button class="o3 t${st[a[0]]?" on":""}${cn(a[0])?"":" dis"}" data-ar="${a[0]}"><span>${a[1]} ${a[2]}<small>${a[3]}</small></span><i class="tg3"></i></button>`).join("")
  +`<div class="s3">Privacy</div><button class="o3 t${an?" on":""}" data-ar="anon"><span>\uD83D\uDE48 Remain anonymous<small>Messages show the group name</small></span><i class="tg3"></i></button>`
  +`<div class="s3">Custom title</div><input id="ar_t" maxlength="24" placeholder="Admin" value="${esc(ti)}"><div class="n3">Shown next to their name in the member list.</div>`
  +(isA?'<button class="o3 red" data-ar="rm" style="margin-top:14px"><span>Dismiss admin</span></button>':"")};
 $("s12t").textContent="Admin rights";$("s12r").innerHTML='<button class="tx" id="ar_ok">Save</button>';
 show(12);$("s12").querySelector(".csb").scrollTop=0;draw();
 $("s12b").onclick=e=>{const b=e.target.closest("[data-ar]");if(!b)return;const k=b.dataset.ar;ti=($("ar_t")||{}).value||"";
  if(k==="rm"){sheet('<h3>Dismiss admin?</h3><div class="sec" style="padding:0 0 10px">'+esc(nm)+' will become a regular member.</div><button class="rowb out" id="gy">Dismiss</button><button class="rowb" data-x="1">Cancel</button>');
   $("gy").onclick=async()=>{const r=await sb.rpc("set_admin",{p_gid:n,p_user:u,p_perms:{},p_title:"",p_anon:false,p_remove:true});unsheet();if(r.error){toast("Couldn't update");return}await loadGroups();showGroupProf(n);toast("Admin dismissed")};return}
  if(k==="all"){const on=!allOn();AR.forEach(a=>{if(cn(a[0]))st[a[0]]=on})}else if(k==="anon")an=!an;else st[k]=!st[k];draw()};
 $("ar_ok").onclick=async()=>{ti=($("ar_t")||{}).value||ti;const r=await sb.rpc("set_admin",{p_gid:n,p_user:u,p_perms:st,p_title:ti.trim(),p_anon:an});
  if(r.error){toast(r.error.code==="42501"?"You can't do that":"Couldn't save");return}
  await loadGroups();showGroupProf(n);toast(isA?"Admin rights saved":"Admin added")}}
function reqCount(n){sb.from("group_join_requests").select("user_id",{count:"exact",head:true}).eq("group_id",n).eq("status","pending").then(r=>{const e=$("grq");if(e&&r.count)e.textContent=" ("+r.count+")"})}
async function joinReqs(n){S12N=n;$("s12t").textContent="Join requests";$("s12r").innerHTML="";show(12);$("s12b").innerHTML='<p class="n3">Loading\u2026</p>';
 const r=await sb.from("group_join_requests").select("user_id,created_at").eq("group_id",n).eq("status","pending").order("created_at",{ascending:true});
 if(r.error){$("s12b").innerHTML='<p class="n3">Couldn\'t load requests.</p>';return}
 let R=r.data||[];await loadPeople(R.map(x=>x.user_id));const S=new Set();
 const ago=t=>{const x=Math.max(0,(Date.now()-Date.parse(t))/1000);return x<60?"just now":x<3600?Math.floor(x/60)+" min ago":x<86400?Math.floor(x/3600)+" h ago":Math.floor(x/86400)+" d ago"};
 const draw=()=>{const k=S.size;
  $("s12b").innerHTML=R.length?`<div class="s3 ar-h"><span>${k} selected</span><button class="tx" data-jr="all">${k===R.length?"Clear":"Select all"}</button></div>`
   +R.map(x=>{const p=PEOPLE[x.user_id],nm=p?p.n:"Someone";return `<div class="jr${S.has(x.user_id)?" on":""}" data-jr="${esc(x.user_id)}"><span class="ck"></span>${avatar("acc",nm,x.user_id)}<div class="t"><div class="n">${esc(nm)}</div><div class="s">${p&&p.u?"@"+esc(p.u)+" \u00B7 ":""}Invite link \u00B7 ${ago(x.created_at)}</div></div></div>`}).join("")
   +`<div class="jbar"><button class="rowb out" data-jr="dc">Decline${k?" ("+k+")":""}</button><button class="rowb" data-jr="ap">Approve${k?" ("+k+")":""}</button></div><div class="n3">Approving has no limit. The 10 limit is only for adding people directly.</div>`
   :'<div class="n3" style="text-align:center;padding:28px 0">No pending requests</div>'};
 draw();
 $("s12b").onclick=async e=>{const b=e.target.closest("[data-jr]");if(!b)return;const k=b.dataset.jr;
  if(k==="all"){if(S.size===R.length)S.clear();else R.forEach(x=>S.add(x.user_id));draw();return}
  if(k==="ap"||k==="dc"){const ids=[...S];if(!ids.length){toast("Select at least one person");return}
   const q=await sb.rpc("review_join_requests",{p_gid:n,p_users:ids,p_approve:k==="ap"});
   if(q.error){toast(q.error.code==="42501"?"You can't review requests":"Couldn't update");return}
   R=R.filter(x=>!S.has(x.user_id));S.clear();draw();loadGroups();toast((q.data||ids.length)+(k==="ap"?" approved":" declined"));return}
  if(S.has(k))S.delete(k);else S.add(k);draw()}}
const _pt=drawPT;
drawPT=function(d,k){if(k==="gr"){const c=$("pcont");if(!c)return;const G=Object.values(GRP).filter(g=>g.member&&(GMEM[g.id]||[]).some(m=>m.u===d.id));
 c.innerHTML=G.length?'<div class="list">'+G.map(g=>`<div class="it" data-k="${esc(g.id)}">${avatar(g.k,g.n)}<div class="t"><div class="n">${esc(g.n)}</div><div class="s">${esc(g.m||"")}</div></div></div>`).join("")+"</div>":'<div class="empty">No groups in common</div>';return}
 return _pt(d,k)};

/* ---- Power saving ---- */
let PSM="off",PSB=null;try{PSM=localStorage.getItem("ps_mode")||"off"}catch(e){}
const psActive=()=>PSM==="on"||(PSM==="low"&&PSB&&PSB.level<=.2&&!PSB.charging);
function psApply(){window._psOn=!!psActive();document.documentElement.classList.toggle("ps",window._psOn)}
function psInit(){try{if(navigator.getBattery)navigator.getBattery().then(b=>{PSB=b;b.addEventListener("levelchange",psApply);b.addEventListener("chargingchange",psApply);psApply()})}catch(e){}psApply()}
const psLabel=()=>PSM==="on"?"On":PSM==="low"?"On at 20%":"Off";
function psSheet(){sheet('<h3>Power Saving</h3><div class="sec" style="padding:0 0 8px">Turns off animations and video autoplay to use less battery.</div>'+[["off","Off"],["low","Turn on when battery is low (20%)"],["on","Always on"]].map(o=>`<button class="rowb sp" data-m="${o[0]}"><span>${o[1]}</span><span class="s">${PSM===o[0]?"\u2713":""}</span></button>`).join("")+'<button class="rowb" data-x="1">Close</button>');
 $("sheet").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{PSM=b.dataset.m;try{localStorage.setItem("ps_mode",PSM)}catch(e){}psApply();unsheet();if(!$("s10").classList.contains("hide"))settingsList();toast("Saved")})}

/* ---- Chat folders ---- */
const FOLD=[];let CUR_F="";
async function loadFolders(){try{const r=await sb.from("chat_folders").select("id,name,chat_ids,position").order("position",{ascending:true});FOLD.length=0;(r.data||[]).forEach(x=>FOLD.push({id:String(x.id),name:x.name,ids:(x.chat_ids||[]).map(String)}))}catch(e){}}
const BF=[["@personal","Personal","acc"],["@groups","Groups","grp"],["@channels","Channels","cha"]];let ALLK=new Set();
const ftabs=()=>{const bf=BF.filter(x=>ALLK.has(x[2])||(x[2]==="acc"&&RQL.length));if(CUR_F&&!bf.some(x=>x[0]===CUR_F)&&!FOLD.some(f=>f.id===CUR_F))CUR_F="";
 if(!FOLD.length&&bf.length<2)return"";
 return `<div class="ftabs"><button class="ft${CUR_F?"":" on"}" data-f="">All</button>${bf.map(x=>`<button class="ft${CUR_F===x[0]?" on":""}" data-f="${x[0]}">${x[1]}</button>`).join("")}${FOLD.map(f=>`<button class="ft${CUR_F===f.id?" on":""}" data-f="${esc(f.id)}">${esc(f.name)}</button>`).join("")}</div>`};
const _th2=trayHtml;trayHtml=function(){return ftabs()+_th2()};
pane.addEventListener("click",ev=>{const b=ev.target.closest(".ft");if(b){ev.stopImmediatePropagation();CUR_F=b.dataset.f;render()}},true);
const _ch=chats;chats=function(){ALLK=new Set(CHATS.map(c=>c[0]));const bk=BF.find(x=>x[0]===CUR_F);
 if(bk&&!$("q").value.trim()){const all0=CHATS.slice();CHATS.length=0;all0.filter(c=>c[0]===bk[2]).forEach(c=>CHATS.push(c));_ch();if(!CHATS.length&&!RQL.length)pane.innerHTML=ftabs()+'<div class="empty">No chats here.</div>';CHATS.length=0;all0.forEach(c=>CHATS.push(c));return}
 const f=CUR_F&&FOLD.find(x=>x.id===CUR_F);if(!f||$("q").value.trim()){_ch();return}
 const all=CHATS.slice();CHATS.length=0;all.filter(c=>f.ids.includes(String(c[5]))).forEach(c=>CHATS.push(c));_ch();
 if(!CHATS.length)pane.innerHTML=ftabs()+'<div class="empty">No chats in this folder.<br>Add chats from Settings \u203A Chat Folders.</div>';
 CHATS.length=0;all.forEach(c=>CHATS.push(c))};
function foldSheet(){sheet('<h3>Chat Folders</h3>'+(FOLD.length?FOLD.map((f,i)=>`<button class="rowb sp" data-i="${i}"><span>${esc(f.name)}</span><span class="s">${f.ids.length} chat${f.ids.length===1?"":"s"}</span></button>`).join(""):'<div class="sec" style="padding:4px 0 10px">Create folders like Work or Friends to sort your chats.</div>')+'<button class="rowb" id="fnew" style="background:var(--pri);color:var(--on);text-align:center">Create new folder</button><button class="rowb" data-x="1">Close</button>');
 $("sheet").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>foldEdit(FOLD[+b.dataset.i]));$("fnew").onclick=()=>{if(FOLD.length>=10){toast("Folder limit reached");return}foldEdit(null)}}
function foldEdit(f){const all=CHATS.slice(),sel=new Set(f?f.ids:[]);
 sheet(`<h3>${f?"Edit folder":"New folder"}</h3><input id="fnm" maxlength="24" placeholder="Folder name" autocomplete="off" value="${f?esc(f.name):""}"><div class="cs-h" style="margin:12px 0 4px">Chats</div><div id="fch">${all.map(c=>`<label class="fck"><input type="checkbox" data-id="${esc(String(c[5]))}"${sel.has(String(c[5]))?" checked":""}><span>${esc(c[1])}</span></label>`).join("")||'<div class="sec">No chats yet</div>'}</div><button class="rowb" id="fsv" style="background:var(--pri);color:var(--on);text-align:center">Save</button>${f?'<button class="rowb out" id="fdl">Delete folder</button>':""}<button class="rowb" data-x="1">Cancel</button>`);
 const done=m=>{unsheet();render();if(!$("s10").classList.contains("hide"))settingsList();toast(m)};
 $("fsv").onclick=async()=>{const name=$("fnm").value.trim(),ids=[...$("fch").querySelectorAll("input:checked")].map(x=>x.dataset.id);if(!name){toast("Enter a folder name");return}
  if(f){f.name=name;f.ids=ids;try{await sb.from("chat_folders").update({name,chat_ids:ids}).eq("id",f.id)}catch(e){}}
  else{const r=await sb.from("chat_folders").insert({name,chat_ids:ids,position:FOLD.length}).select().single();if(r.error){toast(/limit/i.test(r.error.message||"")?"Folder limit reached":"Couldn't save folder");return}FOLD.push({id:String(r.data.id),name,ids})}
  done("Folder saved")};
 if(f)$("fdl").onclick=async()=>{try{await sb.from("chat_folders").delete().eq("id",f.id)}catch(e){}FOLD.splice(FOLD.indexOf(f),1);if(CUR_F===f.id)CUR_F="";done("Folder deleted")}}

/* ---- Settings list (opened from the Profile page) ---- */
const SROWS=()=>[["acc","#4aa3ff","#2f6bff","Account","Email, username, bio",()=>$("edit").click()],["chat","#ffb347","#ff8a3d","Chat Settings","Wallpaper, night mode, animations",()=>{buildCS();show(9)}],["priv","#5fd38d","#2fb36b","Privacy & Security","Last seen, read receipts, blocked",()=>privSheet()],["mail","#4dd4d4","#14a3a3","Message Requests","Who can message me",()=>sub("dm")],["bell","#ff7a7a","#e5484d","Notifications","Sounds, calls, badges",()=>sub("nt")],["fold","#7aa8ff","#3b6cf5","Chat Folders","Sort chats into folders"+(FOLD.length?" \u00B7 "+FOLD.length:""),()=>foldSheet()],["dev","#5ac8fa","#2b9bd9","Devices","Manage connected devices",()=>sub("dv")],["pow","#ffd24d","#f59e0b","Power Saving","Reduce power usage \u00B7 "+psLabel(),()=>psSheet()]];
function settingsList(){const R=SROWS();$("stl").innerHTML='<div class="grp srl">'+R.map((r,i)=>`<button class="srow" data-i="${i}">${sgr(r[0],r[1],r[2])}<span class="stx"><b>${r[3]}</b><small>${r[4]}</small></span></button>`).join("")+'</div><div class="grp srl"><button class="srow out" id="stlo"><span class="stx"><b>Log out</b></span></button><button class="srow out" id="stdl"><span class="stx"><b>Delete account</b></span></button></div>';
 $("stl").querySelectorAll(".srow[data-i]").forEach(b=>b.onclick=()=>R[+b.dataset.i][5]());$("stlo").onclick=logout;$("stdl").onclick=delAccSheet}
$("stbk").onclick=()=>{cur2="set";render();show(4)};
$("csbk").onclick=()=>{settingsList();show(10)};

/* ---- Profile page (bottom tab): Profile 2 with cover ---- */
function coverCrop(file,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const W=1200,H=460,c=document.createElement("canvas");c.width=W;c.height=H;const k=Math.max(W/i.width,H/i.height),w=i.width*k,h=i.height*k;c.getContext("2d").drawImage(i,(W-w)/2,(H-h)/2,w,h);c.toBlob(bl=>cb(bl),"image/jpeg",.82)};i.onerror=()=>cb(null);i.src=r.result};r.onerror=()=>cb(null);r.readAsDataURL(file)}
function coverSet(file){toast("Uploading cover...");coverCrop(file,async blob=>{if(!blob){toast("Couldn't read photo");return}
 try{const path=me.id+"/cover-"+Date.now()+".jpg",up=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});if(up.error)throw up.error;
  const url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl,r=await sb.from("profiles").update({cover_url:url}).eq("id",me.id);if(r.error)throw r.error;
  const old=me.cv;me.cv=url;store.set("user",me);if(old&&old.startsWith(AVP))sb.storage.from("avatars").remove([old.slice(AVP.length)]).then(()=>{});toast("Cover updated");if(cur2==="set")settings()}catch(e){toast("Couldn't upload cover")}})}
async function coverRemove(){try{const old=me.cv,r=await sb.from("profiles").update({cover_url:null}).eq("id",me.id);if(r.error)throw r.error;me.cv="";store.set("user",me);if(old&&old.startsWith(AVP))sb.storage.from("avatars").remove([old.slice(AVP.length)]).then(()=>{});toast("Cover removed");if(cur2==="set")settings()}catch(e){toast("Couldn't remove cover")}}
function coverSheet(){sheet('<h3>Cover photo</h3><button class="rowb" id="cvu">Choose photo</button>'+(me.cv?'<button class="rowb out" id="cvr">Remove cover</button>':"")+'<div class="sec" style="padding:6px 0">Best size: 1200 \u00D7 460 px, landscape.</div><button class="rowb" data-x="1">Close</button>');$("cvu").onclick=()=>{unsheet();$("fcv").click()};if($("cvr"))$("cvr").onclick=()=>{unsheet();coverRemove()}}
$("fcv").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)coverSet(f)};
settings=function(){const d=dp(),cvv=me.cv&&me.cv.startsWith(AVP)?me.cv:"";
 pane.innerHTML=`<div class="pf pf2p own"><div class="pf2c"${cvStyle(cvv)}><button class="pf2chip" id="pf2cv">${sic("cam")}${cvv?"Change cover":"Add cover"}</button></div><div class="pf2av"${d?` style="background:url('${esc(d).replace(/'/g,"%27")}') center/cover"`:""}>${d?"":esc((me.name.trim()[0]||"?").toUpperCase())}</div><div class="name">${esc(me.name)}</div><div class="user">${me.username?"@"+esc(me.username)+" \u00B7 ":""}online</div>
 <div class="pf2btn"><button class="pf2e" id="pf2e">Edit profile</button><button class="pf2i2" id="pf2p" aria-label="Set photo">${sic("cam")}</button><button class="pf2i2" id="pf2g" aria-label="Settings">${sic("gear")}</button></div>
 <div class="grp pf2i">${[["Bio",me.bio],["Username",me.username?"@"+me.username:""],["Email",me.email]].filter(x=>x[1]).map(x=>`<div class="pf2r" data-cp="${esc(x[1])}"><b>${esc(x[1])}</b><small>${x[0]}</small></div>`).join("")}</div></div>`;
 $("pf2cv").onclick=coverSheet;$("pf2p").onclick=()=>$("fdp").click();$("pf2e").onclick=()=>$("edit").click();$("pf2g").onclick=()=>{settingsList();show(10)};
 pane.querySelectorAll(".pf2r").forEach(r=>r.onclick=()=>copyTxt(r.dataset.cp,"Copied"))};
$("fdp").addEventListener("change",()=>setTimeout(()=>{if(cur2==="set"&&!$("s4").classList.contains("hide"))settings()},1400));
const _ri=r1Init;r1Init=async function(){await _ri();await loadFolders();psInit()};

})();
