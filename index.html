<title>Rackgram</title>
<style>

.row{display:flex;gap:10px;margin-bottom:14px}

select{width:42%;flex:none}

button.link{background:none;color:var(--mut);font-weight:500;font-size:14px;height:40px}
.hint{font-size:12px;margin:-8px 0 12px;min-height:16px;color:var(--mut)}.hint.bad{color:var(--err)}.hint.good{color:var(--ok)}
.otp{display:flex;gap:6px;justify-content:center;margin-bottom:16px}

.demo{background:var(--card);border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--mut);margin-bottom:18px}
.demo b{color:var(--fg);letter-spacing:3px;font-size:17px}
.hide{display:none!important}

/* ---------- Main (Telegram-style) ---------- */
.app.full{padding:0;overflow:hidden}
#s4,#s5{height:100%;flex-direction:column}
#s4:not(.hide),#s5:not(.hide){display:flex}

.sb .x{position:absolute;right:3px;top:3px;width:36px;height:36px;margin:0;padding:0;background:none;color:var(--mut);font-size:20px;font-weight:400;border-radius:50%}
.tabs{display:flex;gap:8px;padding:2px 16px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.tab{width:auto;height:34px;margin:0;padding:0 14px;border-radius:17px;background:var(--card);color:var(--mut);font-size:13px;font-weight:600;flex:none}
.tab.on{background:var(--pri);color:var(--on)}
.pane{flex:1;overflow-y:auto;min-height:0}
.list{padding:0 8px 16px}

.ava.ch{border-radius:16px}

.it .s.miss{color:var(--err)}

.it .tm{font-size:12px;color:var(--mut)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--pri);color:var(--on);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}
.it mark{background:none;color:var(--fg);font-weight:800;text-decoration:underline;text-decoration-color:var(--mut);text-underline-offset:2px}
.kind{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:2px 8px;flex:none}
.empty{text-align:center;color:var(--mut);padding:56px 24px;font-size:14px}

/* bottom bar */
.nav{display:flex;flex:none;border-top:1px solid var(--line);background:var(--bg);padding:6px 4px}
.nb{flex:1;margin:0;height:54px;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;border-radius:12px;position:relative}
.nb svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--fg)}
.nb.on svg{fill:var(--card)}
.nb .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--pri);color:var(--on);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* settings tab */
.me{text-align:center;padding:10px 16px 20px}
.av{width:92px;height:92px;border-radius:50%;background:var(--pri);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600;margin:0 auto 12px}
.name{font-size:22px;font-weight:600}.user{color:var(--mut);margin-top:2px;min-height:20px}
.ph{color:var(--mut);font-size:14px;margin-top:2px}
.grp{margin:0 16px 16px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row2{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.row2:first-child{border-top:0}
.row2 .l{flex:1;min-width:0}
.row2 .k{font-size:12px;color:var(--mut)}
.row2 .v{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.rowb{width:100%;margin:0;height:auto;background:none;color:var(--fg);font-weight:500;font-size:16px;text-align:left;border-radius:0}
button.rowb.out{color:var(--err)}
.set{padding:8px 22px 28px;overflow-y:auto}
.set .av{margin:10px auto 22px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
#s6,#s7{height:100%;flex-direction:column}#s6:not(.hide),#s7:not(.hide){display:flex}
.dpb{display:flex;justify-content:center;gap:8px;margin:-10px 0 18px}.dpb .tx{font-size:14px;color:var(--pri)}
.chh{flex:1;display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}.chh .ava{width:38px;height:38px;font-size:15px}.chh .ava svg{width:20px;height:20px}

.b{max-width:78%;padding:8px 12px;border-radius:16px;font-size:15px;word-wrap:break-word}.b.in{align-self:flex-start;background:var(--bg)}.b.in.hasav{margin-left:40px;position:relative;max-width:calc(78% - 12px)}.mav{position:absolute;left:-40px;bottom:0;width:32px;height:32px;cursor:pointer}.mav .ava{width:32px;height:32px;font-size:13px;margin:0}.gsn{cursor:pointer}.b.out{align-self:flex-end;background:var(--pri);color:var(--on)}
.cin{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}

.dots{font-size:24px;line-height:1}.pf{text-align:center;padding:16px}.pf .av{margin-bottom:10px}.pf .ava{margin:0 auto 10px;width:92px;height:92px}.pf .ava svg{width:40px;height:40px}.pf .pb2{width:auto;padding:0 24px;margin:12px 4px 0;display:inline-block}
.st{display:inline-block;font-size:12px;color:var(--err);border:1px solid var(--err);border-radius:8px;padding:2px 8px;margin-top:6px}.sec{padding:8px 16px;font-size:13px;color:var(--mut);font-weight:600}
.menu{position:fixed;top:60px;right:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:30;overflow:hidden;min-width:180px}
.menu button{height:46px;margin:0;border-radius:0;background:none;color:var(--fg);text-align:left;padding:0 16px;font-weight:500;font-size:15px}.menu button.d{color:var(--err)}
#sty{position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center}#sty img{max-width:100%;max-height:100%}
.sbar{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:12px}.sbar button{width:auto;height:40px;padding:0 16px;margin:0;background:rgba(255,255,255,.2);color:#fff}
.tx svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#s8{height:100%;flex-direction:column}#s8:not(.hide){display:flex}
/* New group / channel sizes (tuned by user) */
#s8 .top h2{font-size:18px}
#s8 .set{padding:8px 17px 28px}
#s8 label{font-size:16px}

#csbk{white-space:nowrap;width:auto}
#s9{height:100%;flex-direction:column}#s9:not(.hide){display:flex}
.csb{flex:1;overflow-y:auto;padding:0 16px 28px}
.cs-h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:14px 4px 8px}

.cs-sl{display:flex;align-items:center;gap:10px;font-size:19px}.cs-sl b{min-width:30px;text-align:right}

.cs-t.on{border-color:#fff;outline:2px solid var(--pri)}
.cs-ds{display:flex;gap:10px;flex-wrap:wrap}.cs-d{width:44px;height:44px;border-radius:50%;border:2px solid transparent}.cs-d.on{border-color:#fff;outline:2px solid #888}

.cs-seg button{flex:1;margin:0;height:34px;border-radius:9px;background:transparent;color:var(--fg);font-size:16px;font-weight:600}.cs-seg button.on{background:var(--pri);color:var(--on)}
.cs-r{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:19px;border-top:1px solid var(--line)}.cs-r:first-child{border-top:0}
.cs-sw{width:44px;height:26px;border-radius:13px;background:#52525b;position:relative;flex:none}.cs-sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.cs-sw.on{background:#16a34a}.cs-sw.on::after{left:21px}
/* smooth open animations */
@keyframes csIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes csUp{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
@keyframes csFade{from{opacity:0}to{opacity:1}}
@keyframes csPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.app>section:not(.hide){animation:csIn .22s cubic-bezier(.2,.8,.2,1)}
#sheet:not(.hide) .pn{animation:csUp .26s cubic-bezier(.2,.8,.2,1)}
#sheet:not(.hide) .bk{animation:csFade .2s ease-out}
.menu:not(.hide){animation:csPop .14s ease-out;transform-origin:top right}
#k_call:not(.hide),#k_ring:not(.hide){animation:csFade .22s ease-out}
button{transition:transform .1s,background-color .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.96)}
*{-webkit-tap-highlight-color:transparent}
button,a,.it,.nb,.tab{touch-action:manipulation}

.nbw{width:250px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:14px 18px;display:flex;align-items:center}
.nbw textarea{width:100%;border:0;outline:0;background:none;color:var(--fg);font:inherit;font-size:18px;line-height:1.35;text-align:center;resize:none;overflow:hidden;height:26px;padding:0;caret-color:#4c5ef7}
.ntl{position:relative;height:22px;width:250px}.ntl i{position:absolute;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.ntl i:nth-child(1){width:12px;height:12px;left:105px;top:4px}.ntl i:nth-child(2){width:7px;height:7px;left:97px;top:15px}
.ncn{font-size:13px;color:var(--mut);margin-top:10px;height:18px}
.nau{margin:8px 16px 4px;padding:12px 14px;border-radius:14px;background:var(--card);font-size:14px}.nau b{display:block;font-weight:500}.nau small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
</style>
<style id="mlx-css">
/* multi-line text: line breaks and blank lines are kept everywhere */
.mtx{white-space:pre-wrap;word-break:break-word}
.cap,.nview .nbub span,.nnt{white-space:pre-wrap}
textarea.mlx{display:block;resize:none;overflow-y:auto;font:inherit;outline:none;box-sizing:border-box;min-width:0;scrollbar-width:none}
textarea.mlx::-webkit-scrollbar{display:none}
textarea.mlb{width:100%;min-height:50px;height:50px;max-height:150px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);padding:13px 14px;line-height:22px}
textarea.mlb:focus{border-color:var(--pri)}
.cin{align-items:flex-end}
.cin textarea.mlx{flex:1;width:100%;min-height:44px;height:44px;max-height:132px;border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--fg);padding:10px 14px;line-height:22px}
.cin textarea.mlx:focus{border-color:var(--pri)}
.nrow textarea.mlx{flex:1;margin:0}
.svr textarea.mlx{flex:1;width:auto;min-height:44px;height:44px;max-height:110px;border-radius:22px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.25);color:#fff;padding:10px 16px;font-size:15px;line-height:22px;margin:0}
.svr textarea.mlx::placeholder{color:rgba(255,255,255,.7)}
.pxin textarea.mlx{flex:1;min-width:0;margin:0;min-height:44px;height:44px;max-height:120px;border-radius:10px;padding:11px 16px;background:#2c2c2e;color:#fff;border:0;font-size:15px;line-height:22px}
.pxsf textarea.mlx{width:100%;margin:0;min-height:42px;height:42px;max-height:120px;border-radius:21px;padding:10px 16px;background:#363636;color:#f5f5f5;border:0;font-size:14px;line-height:22px}
</style>
<style id="acc-css">
.aav{border-radius:50%;background-color:rgba(127,127,127,.3);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none;background-size:cover;background-position:center;filter:none}
.aav.on{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--fg)}
.acl{font-size:13px;color:var(--mut);margin:6px 8px 8px}
.accs .srow{padding:10px 16px;gap:14px}
.accs .srow+.srow{border-top:1px solid var(--line)}
.accs .stx b{font-size:17px}.accs .stx small{font-size:14px;margin-top:2px}
.accs .srow.dis{opacity:.45}
.accs .sic.acp{width:46px;height:46px}
.aok{margin-left:auto;display:grid;place-items:center;flex:none}
.aok svg{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.abg{margin-left:auto;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center;flex:none}
.abg.on{display:inline-flex}
#accpop .aok svg{width:18px;height:18px}#accpop .abg{min-width:20px;height:20px;font-size:11.5px;padding:0 6px;border-radius:10px}
#accpop .aav.on{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--fg)}
#accpop{position:fixed;inset:0;z-index:60}
#accpop .apb{position:absolute;inset:0;background:rgba(0,0,0,.4)}
#accpop .app{position:absolute;right:12px;width:218px;max-width:calc(100% - 24px);max-height:56vh;overflow-y:auto;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:block}
#accpop button{display:flex;align-items:center;gap:10px;width:100%;height:auto;margin:0;padding:7px 12px;background:none;color:var(--fg);border-radius:0;text-align:left;font-size:14px;font-weight:500}
#accpop button:active{background:var(--line)}
#accpop button.dis{opacity:.45}
#accpop .si{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#accpop .an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#accpop .an small{display:block;font-size:11.5px;font-weight:400;color:var(--mut)}
#accpop .ad{height:4px;background:var(--bg)}
#addbk{width:auto;height:auto;margin:0 0 6px;padding:4px 0;background:none;color:var(--mut);font-size:16px;text-align:left;align-self:flex-start}
</style>
</head>

async function joinRoom(id,kind){
 const L=window.LivekitClient;if(!L)throw new Error("lib");
 const r=await sb.functions.invoke("livekit-token",{body:{call_id:id}});
 if(r.error||!r.data||!r.data.token)throw new Error("token");
 const room=new L.Room({adaptiveStream:true,dynacast:true});CALL.room=room;
 const E=L.RoomEvent;
 const seen=async p=>{await loadPeople([p.identity]);tileFor(p.identity);if(CALL&&!CALL.answered){CALL.answered=true;clearTimeout(CALL.to);callStat()}};
 room.on(E.ParticipantConnected,seen);
 room.on(E.ParticipantDisconnected,p=>{dropTile(p.identity);if(CALL&&room.remoteParticipants.size===0&&!CALL.group)endCall()});
 room.on(E.TrackSubscribed,(track,pub,p)=>{if(track.kind==="video")putVideo(p.identity,track,false);else{const a=track.attach();a.dataset.lk="1";document.body.appendChild(a)}});
 room.on(E.TrackUnsubscribed,(track,pub,p)=>{if(track.kind==="video")dropVideo(p.identity,track);else track.detach().forEach(e=>e.remove())});
 room.on(E.LocalTrackPublished,pub=>{if(pub.track&&pub.track.kind==="video")putVideo(me.id,pub.track,true)});
 room.on(E.LocalTrackUnpublished,pub=>{if(pub.track&&pub.track.kind==="video")dropVideo(me.id,pub.track)});
 room.on(E.ActiveSpeakersChanged,sp=>{const S=new Set(sp.map(x=>x.identity));document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("sp",S.has(t.id.slice(2))))});
 room.on(E.Disconnected,()=>{if(CALL&&CALL.room===room)endCall()});
 await room.connect(r.data.url,r.data.token);
 try{await room.startAudio()}catch(e){}
 await room.localParticipant.setMicrophoneEnabled(true);
 if(kind==="video")await room.localParticipant.setCameraEnabled(true);
 const ids=[...room.remoteParticipants.values()].map(p=>p.identity);await loadPeople(ids);
 room.remoteParticipants.forEach(p=>seen(p))}

async function startCall(oid,kind){

 if(ST.blk.includes(oid))return toast("Unblock to call");
 let c;
 try{const a=await sb.from("calls").insert({kind}).select().single();if(a.error)throw a.error;c=a.data;
  const b=await sb.from("call_participants").insert([{call_id:c.id,user_id:me.id,status:"joined",invited_by:me.id},{call_id:c.id,user_id:oid,status:"invited",invited_by:me.id}]);if(b.error)throw b.error}
 catch(e){toast(e&&e.code==="P0001"&&e.message?e.message:"Couldn't start call");return}
 openCallUI(c.id,kind,[oid],true);
 try{await joinRoom(c.id,kind)}catch(e){toast("Couldn't connect (check mic/camera permission)");endCall("ended");return}
 if(CALL&&CALL.id===c.id&&!CALL.answered){$("k_stat").textContent="Ringing…";CALL.to=setTimeout(()=>{if(CALL&&CALL.id===c.id&&!CALL.answered){toast("No answer");endCall("missed")}},45000)}}

async function endCall(st){
 const c=CALL;if(!c)return;CALL=null;clearTimeout(c.to);clearInterval(cTick);
 const n=c.room?c.room.remoteParticipants.size:0,alone=n===0,many=!!c.group||n>1;

 setTimeout(()=>{try{c.room&&c.room.disconnect()}catch(e){}},0);
 const now=new Date().toISOString();
 const fin=st||(alone?(c.out&&!c.answered?"missed":"ended"):(many?null:"ended"));
 const jobs=[];
 if(fin)jobs.push(sb.from("calls").update({status:fin,ended_at:now}).eq("id",c.id).in("status",["ringing","active"]));
 jobs.push(sb.from("call_participants").update({status:"left",updated_at:now}).eq("call_id",c.id).eq("user_id",me.id));
 try{await Promise.all(jobs.map(j=>Promise.resolve(j).catch(()=>{})))}catch(e){}
 loadCallLog()}

 if(Date.now()-Date.parse(row.updated_at)>45000)return;
 const busy=()=>sb.from("call_participants").update({status:"declined",updated_at:new Date().toISOString()}).eq("call_id",row.call_id).eq("user_id",me.id);

 if(!c||["ended","missed","declined"].includes(c.status))return;
 if(CALL||RING||ST.blk.includes(c.caller_id)){try{await busy()}catch(e){}return}
 const from=row.invited_by||c.caller_id;await loadPeople([from,c.caller_id]);

 c.font=`${it.type==="emoji"?"400":"700"} ${px}px ${SFONT[it.font||0].f}`;const al=it.al||0;c.textAlign=["center","left","right"][al];c.textBaseline="middle";

 else if(it.bgm){seRR(c,-bw/2,-bh/2,bw,bh,px*.3);c.fillStyle=it.color;c.fill();c.fillStyle=ink(it.color)}
